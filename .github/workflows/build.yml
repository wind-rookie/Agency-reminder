name: Build and Release

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 运行测试
        run: npx vitest run

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 同步版本号
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 构建 EXE
        run: npm run build
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 查找 EXE 文件
        id: find-exe
        shell: bash
        run: |
          EXE_PATH=$(find release -maxdepth 1 -name "*.exe" -not -name "builder-debug*" | head -1)
          echo "path=$EXE_PATH" >> $GITHUB_OUTPUT
          echo "找到 EXE: $EXE_PATH"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-exe.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
